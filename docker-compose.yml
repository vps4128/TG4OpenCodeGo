name: tg4opencodego

services:
  tg4opencodego:
    # 镜像由 GitHub Actions 构建并推送到 GHCR。
    # 镜像公开可拉取，无需登录。
    # 本地临时构建：docker build -t ghcr.io/vps4128/tg4opencodego:latest .
    image: ghcr.io/vps4128/tg4opencodego:latest
    container_name: tg4opencodego
    env_file: .env
    restart: unless-stopped
    init: true
    volumes:
      # 使用命名卷，避免宿主机目录属主与容器内 node 用户不一致。
      # 如需直接查看 SQLite 文件，可改成 ./data:/app/data，
      # 并先执行 mkdir -p data && chown 1000:1000 data。
      - tg4opencodego-data:/app/data
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  tg4opencodego-data:
